name: Promote template
# LESSEN (niet verwijderen bij refactor):
# - run: > (NOOIT run: | met multi-line $(...): newline = scheiding, exit 127)
# - Geen top-level concurrency op callers; inputs-defaults; matrix-guards.
# - Composites erven geen secrets; export voor strenv(); yq -r; diff-guards.
# - SDK-versiebron = global.json (enige bron; geen dotnet-version-inputs).
# - Dispatch-only: aanroepen uitsluitend vanuit een caller met
#   `on: workflow_dispatch`; de push-keten gebruikt cd-dev-template.yml.
# - Validatie (SemVer + registry) loopt ALTIJD vóór copy/bump (v7;
#   in v6 stond validatie na copy).

on:
  workflow_call:
    inputs:
      project:
        description: 'Project-key uit .github/projects.json'
        required: true
        type: string
      version:
        description: 'SemVer-versie die al als image in het registry staat'
        required: true
        type: string
      environment:
        description: 'Doelomgeving voor de promote'
        required: false
        default: 'prd'
        type: string
      registry-host:
        description: 'Registry-host voor image-referenties'
        required: false
        default: 'go.berg-connect.nl'
        type: string
      repository:
        description: 'Repository-namespace voor images'
        required: false
        default: 'beheerder'
        type: string
      dest-registry-host:
        description: 'Registry-host prd (kopie-bestemming)'
        required: false
        default: '192.168.2.100:3003'
        type: string
      dest-repository:
        description: 'Repository-namespace op prd-registry'
        required: false
        default: 'beheerder'
        type: string
    secrets:
      GITEA_TOKEN:
        required: true
      GH_PAT:
        required: true
      BOT_GPG_PRIVATE_KEY:
        required: true
      GITEA_DST_TOKEN:
        required: false

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

permissions: {}

concurrency:
  group: promote-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate version for ${{ inputs.environment }}
    runs-on: [self-hosted]
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard dispatch inputs
        env:
          PROJECT: ${{ inputs.project }}
          VER: ${{ inputs.version }}
          TARGET: ${{ inputs.environment }}
        run: >
          [ -n "$PROJECT" ] ||
          { echo "::error::Lege project-input (dispatch-only)"; exit 1; };
          case "$TARGET" in dev|prd|acc) ;; *) echo "::error::Onbekende
          omgeving '$TARGET' (kies dev, acc of prd)"; exit 1;; esac;
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
          { echo "::error::Versie '$VER' is geen SemVer (x.y.z)"; exit 1; };
          echo "Promote $PROJECT $VER naar $TARGET"

      - name: Resolve image name
        id: resolve
        env:
          PROJECT: ${{ inputs.project }}
        run: >
          IMAGE=$(jq -r --arg p "$PROJECT"
          '.[$p].image_name // empty' .github/projects.json);
          [ -n "$IMAGE" ] ||
          { echo "::error::$PROJECT ontbreekt in .github/projects.json";
          exit 1; };
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Check version exists in registry
        env:
          IMAGE_NAME: ${{ steps.resolve.outputs.image }}
          REGISTRY: ${{ inputs.registry-host || 'go.berg-connect.nl' }}
          REPOSITORY: ${{ inputs.repository || 'beheerder' }}
          VER: ${{ inputs.version }}
        run: >
          IMAGE="$REGISTRY/$REPOSITORY/$IMAGE_NAME";
          skopeo inspect --tls-verify=false
          --creds "${{ vars.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}"
          docker://$IMAGE:$VER > /dev/null ||
          { echo "::error::$IMAGE:$VER ontbreekt in registry"; exit 1; }

  copy-image:
    name: Copy image to ${{ inputs.environment }} registry
    runs-on: [self-hosted]
    needs: [validate]
    if: inputs.environment == 'prd' || inputs.environment == 'acc'
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PROJECT: ${{ inputs.project }}
      IMAGE_NAME: ${{ needs.validate.outputs.image }}
      REGISTRY: ${{ inputs.registry-host || 'go.berg-connect.nl' }}
      REPOSITORY: ${{ inputs.repository || 'beheerder' }}
      VER: ${{ inputs.version }}
    steps:
      - name: Copy image to ${{ inputs.environment }} registry
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/runtime
          SRC_CREDS: ${{ vars.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}
          DST_CREDS: ${{ vars.GITEA_USER }}:${{ secrets.GITEA_DST_TOKEN }}
          DST_REGISTRY: ${{ inputs.dest-registry-host }}
          DST_REPOSITORY: ${{ inputs.dest-repository }}
          DST_TOKEN_SET: ${{ secrets.GITEA_DST_TOKEN != '' }}
        run: >
          mkdir -p "$XDG_RUNTIME_DIR";
          if [ "$DST_TOKEN_SET" != "true" ]; then
          echo "::error::GITEA_DST_TOKEN ontbreekt"; exit 1; fi;
          SRC="$REGISTRY/$REPOSITORY/$IMAGE_NAME:$VER";
          DST="$DST_REGISTRY/$DST_REPOSITORY/$IMAGE_NAME:$VER";
          SRC_URL="docker://$SRC";
          DST_URL="docker://$DST";
          skopeo copy --src-tls-verify=false --dest-tls-verify=false
          --src-creds "$SRC_CREDS" --dest-creds "$DST_CREDS"
          "$SRC_URL" "$DST_URL";
          SRC_DIGEST=$(skopeo inspect --tls-verify=false
          --creds "$SRC_CREDS" "$SRC_URL" | jq -r .Digest);
          DST_DIGEST=$(skopeo inspect --tls-verify=false
          --creds "$DST_CREDS" "$DST_URL" | jq -r .Digest);
          if [ -z "$SRC_DIGEST" ] || [ "$SRC_DIGEST" != "$DST_DIGEST" ];
          then echo "::error::Digest-mismatch na kopie ($SRC_DIGEST vs
          $DST_DIGEST)"; exit 1; fi;
          echo "Gekopieerd + geverifieerd: $DST @$DST_DIGEST"

  promote:
    name: Promote tag to ${{ inputs.environment }}
    runs-on: [self-hosted]
    needs: [validate, copy-image]
    if: >
      always() &&
      needs.validate.result == 'success' &&
      (inputs.environment == 'dev' ||
      needs.copy-image.result == 'success')
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    environment: ${{ inputs.environment }}
    concurrency:
      group: promote-${{ inputs.project }}-${{ inputs.environment }}
      cancel-in-progress: true
    env:
      PROJECT: ${{ inputs.project }}
      IMAGE_NAME: ${{ needs.validate.outputs.image }}
      REGISTRY: ${{ inputs.registry-host || 'go.berg-connect.nl' }}
      REPOSITORY: ${{ inputs.repository || 'beheerder' }}
      VER: ${{ inputs.version }}
      TARGET: ${{ inputs.environment }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Promote tag to ${{ inputs.environment }} via composite
        id: promote
        uses: bergconnect/cicd-workflows/.github/actions/bump-image-tag@v11
        with:
          project: ${{ inputs.project }}
          env-name: ${{ inputs.environment }}
          version: ${{ inputs.version }}
          image-name: ${{ needs.validate.outputs.image }}
          branch: "ci/promote-${{ inputs.project }}-\
            ${{ inputs.environment }}-${{ inputs.version }}"
          commit-message: "ci: promote ${{ inputs.project }} \
            ${{ inputs.environment }} to ${{ inputs.version }}"
          pr-title: "ci: promote ${{ inputs.project }} \
            ${{ inputs.environment }} to ${{ inputs.version }}"
          pr-body: Automated promotion of validated image
            ${{ inputs.version }} to ${{ inputs.environment }}.
          token: ${{ secrets.GH_PAT }}
          gpg-key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          key-id: ${{ vars.BOT_GPG_KEYID }}
